[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "contextcon-heartbeat"
version = "0.1.0"
description = "Evidence-backed company trust triage for investment research"
requires-python = ">=3.11"
dependencies = ["httpx>=0.28,<1"]

[project.scripts]
heartbeat = "heartbeat.cli:main"

[tool.setuptools.packages.find]
include = ["heartbeat*"]
